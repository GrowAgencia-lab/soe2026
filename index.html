<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#283b8b;--cyan:#26a7de;--teal:#56c3d1;--blue:#1f78b9;--ink:#26304a;--muted:#6b7890;--bg:#f2f5f9;--line:#dbe3ec;--ok:#1b8a4b;--warn:#c77700;--err:#c62828;--wa:#25d366}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.wide{max-width:1100px}
h1,h2,h3{font-family:'Josefin Sans',Montserrat,sans-serif;color:var(--navy);margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* encabezado público */
.hero{text-align:center;padding:22px 0 8px}
.hero img{width:150px}
.hero p{margin:10px 0 0;color:var(--muted);font-size:14px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.top img{height:34px}
.back{border:0;background:#fff;border-radius:999px;width:38px;height:38px;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08);color:var(--navy);font-size:18px;flex-shrink:0}
.top h2{font-size:20px;flex:1}

/* tarjetas */
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(30,50,90,.06);margin-bottom:12px}
.big{display:flex;gap:14px;align-items:center;border:0;width:100%;text-align:left;background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 2px 12px rgba(30,50,90,.07);margin-bottom:12px;color:var(--ink);transition:transform .1s}
.big:active{transform:scale(.98)}
.big .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex-shrink:0;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#fff}
.big.alt .ic{background:linear-gradient(135deg,var(--navy),var(--blue))}
.big b{display:block;font-size:17px;color:var(--navy);font-family:'Josefin Sans',Montserrat,sans-serif}
.big span{font-size:13px;color:var(--muted)}
.big .arr{margin-left:auto;color:var(--cyan);font-size:22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.tile{border:0;background:#fff;border-radius:16px;padding:16px 12px;box-shadow:0 2px 12px rgba(30,50,90,.06);text-align:center;color:var(--navy);font-weight:600;font-size:14px}
.tile .e{font-size:26px;display:block;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* botones */
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;fill:currentColor}

/* formularios */
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 0}
.inp{display:block;width:100%;margin-top:5px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px}
.inp:focus{outline:2px solid var(--cyan);border-color:transparent}
textarea.inp{min-height:96px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:14px}
.chk input{margin-top:2px;width:18px;height:18px}
.err{color:var(--err);font-size:13px;margin-top:8px;min-height:1em}
.note{background:#eef7fb;border-left:4px solid var(--cyan);padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5;margin:12px 0}
.note.warn{background:#fff6e6;border-color:#f0a500}

/* pasos turno */
.steps{display:flex;gap:6px;margin:0 0 16px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--cyan)}
.opt{display:block;width:100%;text-align:left;border:2px solid transparent;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:0 1px 6px rgba(30,50,90,.06);color:var(--ink)}
.opt b{display:block;color:var(--navy);font-size:15px}
.opt span{font-size:13px;color:var(--muted)}
.opt small{float:right;color:var(--blue);font-weight:600;font-size:12px}
.opt.sel{border-color:var(--cyan);background:#f2fbfe}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 64px;border:2px solid transparent;background:#fff;border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 1px 6px rgba(30,50,90,.06);color:var(--ink)}
.day small{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.day b{display:block;font-size:20px;color:var(--navy)}
.day.sel{border-color:var(--cyan);background:#f2fbfe}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin-top:8px}
.slot{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 4px;font-weight:600;color:var(--navy)}
.slot.sel{border-color:var(--cyan);background:var(--cyan);color:#fff}
.sum{background:#f6f9fc;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7}
.sum b{color:var(--navy)}
.okbig{text-align:center;padding:10px 0}
.okbig .c{width:74px;height:74px;border-radius:50%;background:#e6f7ee;color:var(--ok);display:grid;place-items:center;font-size:38px;margin:6px auto 12px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:26px;line-height:1.7}
.foot a{color:var(--muted)}
.loading{text-align:center;padding:40px 10px;color:var(--muted)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini .tile{padding:14px 10px}
.team{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mem{background:#fff;border-radius:16px;padding:16px 12px;text-align:center;box-shadow:0 2px 12px rgba(30,50,90,.06)}
.av{width:88px;height:88px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,var(--teal),var(--blue)) center/cover no-repeat;display:grid;place-items:center;color:#fff;font-family:'Josefin Sans',Montserrat,sans-serif;font-size:30px;font-weight:600;border:3px solid #fff;box-shadow:0 2px 10px rgba(30,50,90,.15)}
.mem b{display:block;color:var(--navy);font-size:14px}
.mem .cg{display:block;font-size:12px;color:var(--blue);font-weight:600;margin-top:3px}
.mem p{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.promo{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(30,50,90,.07);margin-bottom:14px}
.promo .pi{aspect-ratio:16/8;background:linear-gradient(135deg,var(--cyan),var(--navy)) center/cover no-repeat;position:relative}
.promo .bd{position:absolute;left:12px;top:12px;background:#ffb300;color:#1d1d1d;font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px}
.promo .pb{padding:14px 16px 16px}
.promo h3{font-size:18px}
.promo p{font-size:14px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.promo .pr{font-size:20px;font-weight:700;color:var(--blue);margin-top:8px}
.promo .vh{font-size:12px;color:var(--muted);margin-top:6px}
.promo .row{margin-top:12px}

/* recepción */
.abar{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.abar .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.abar img{height:30px}
.abar h3{font-size:16px;flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;max-width:1100px;margin:0 auto;padding:0 16px 10px}
.tab{border:0;background:#eef2f7;color:var(--navy);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px}
.tab.on{background:var(--navy);color:#fff}
.tab .n{background:var(--err);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters .inp{width:auto;flex:1;min-width:160px;margin:0;padding:9px 12px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--cyan);border-color:var(--cyan);color:#fff}
.sol{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 8px rgba(30,50,90,.06);border-left:5px solid var(--line)}
.sol.Nueva{border-left-color:var(--err)}
.sol.Contactada{border-left-color:#f0a500}
.sol.Agendada,.sol.Confirmada{border-left-color:var(--cyan)}
.sol.Atendida{border-left-color:var(--ok)}
.sol.Descartada{opacity:.6}
.sol-h{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sol-h b{font-size:15px;color:var(--navy)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#eef2f7;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.tag.Turno{background:#e3f4fb;color:var(--blue)}
.tag.Consulta{background:#f3ecff;color:#6a3fb5}
.tag.Acceso{background:#fff3cd;color:#7a5b00}
.tag.Pago{background:#e6f7ee;color:var(--ok)}
.tag.Cancelación,.tag.Cambio{background:#fde8e8;color:var(--err)}
.ptop{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.ptop h2{flex:1;font-size:20px}
.bigamt{font-size:30px;font-weight:700}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eef2f7;font-size:14px}
.kv:last-child{border-bottom:0}
.st{margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;color:var(--navy);background:#fff}
.sol-d{font-size:13px;color:var(--muted);margin:8px 0;line-height:1.6}
.sol-d b{color:var(--ink)}
.sol-m{background:#f6f9fc;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0;white-space:pre-line}
.sol textarea{width:100%;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13px;min-height:38px;resize:vertical;color:var(--ink);background:#fcfdfe}
.sol .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ag{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 8px rgba(30,50,90,.06);font-size:14px}
.ag th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.ag td{padding:10px 12px;border-bottom:1px solid #eef2f7;vertical-align:top}
.ag .h{font-weight:700;color:var(--navy);white-space:nowrap}
.est{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.est.c0{background:#fff1e0;color:var(--warn)}.est.c1{background:#e3f4fb;color:var(--blue)}.est.c2{background:#e6f7ee;color:var(--ok)}.est.c3{background:#fde8e8;color:var(--err)}
.cfgt{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden}
.cfgt th,.cfgt td{padding:8px 10px;border-bottom:1px solid #eef2f7;text-align:left}
.cfgt th{background:#eef2f7;color:var(--navy)}
.demo{display:inline-block;font-size:11px;background:#fff3cd;color:#7a5b00;padding:3px 8px;border-radius:6px;font-weight:600}

.modal{position:fixed;inset:0;background:rgba(15,25,50,.55);z-index:80;display:grid;place-items:center;padding:14px}
.m-box{background:var(--bg);border-radius:18px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:18px}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.m-head button{border:0;background:none;font-size:22px;color:var(--muted)}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-100px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;transition:transform .25s;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.err{background:var(--err)}
@media(max-width:640px){.ag .hide-m{display:none}}
</style>
</head>

const toMin = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
const toHm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
function calcSlots(cfg, profs, servicios, citas, fecha, servId, nowStr) {
  const s = servicios.find(x => x.id === servId); if (!s) return [];
  const dow = parseYmd(fecha).getDay();
  const res = {};
  profs.filter(p => p.esp.split(',').map(x => x.trim()).includes(s.esp) && p.dias.split(',').map(Number).includes(dow)).forEach(p => {
    const ocup = citas.filter(c => c.fecha === fecha && c.profId === p.id && c.estado !== 'Cancelado').map(c => [toMin(c.hora), toMin(c.hora) + Number(c.dur)]);
    p.horario.split(',').forEach(b => {
      const [ini, fin] = b.trim().split('-').map(toMin);
      for (let t = ini; t + Number(s.dur) <= fin; t += Number(cfg.paso)) {
        const hm = toHm(t);
        if (`${fecha} ${hm}` < nowStr) continue;
        if (ocup.some(([a, z]) => t < z && t + Number(s.dur) > a)) continue;
        if (!res[hm]) res[hm] = p.id;
      }
    });
  });
  return Object.keys(res).sort().map(h => ({ hora: h, prof: res[h] }));
}

        if (!sl) return { ok: false, error: 'Ese horario se acaba de ocupar. Elegí otro, por favor.' };
        const s = sv(p.servicio), ci = String(p.ci).replace(/\D/g, '');
        const cita = { id: 'C' + Date.now(), fecha: p.fecha, hora: p.hora, dur: s.dur, servId: s.id, servicio: s.nombre, profId: sl.prof, paciente: p.nombre, ci, tel: p.tel, estado: 'No confirmado' };
        db.citas.push(cita);
        if (!db.pac.some(x => x.ci === ci)) db.pac.push({ ci, nombre: p.nombre, tel: p.tel });
        db.sol.unshift({ id: 'S' + Date.now(), creada: this.stamp(), tipo: 'Turno', origen: p.origen || 'Soy nuevo', estado: 'Nueva', nombre: p.nombre, ci, tel: p.tel, email: p.email || '', servicio: s.nombre, fecha: p.fecha, hora: p.hora, prof: sl.prof, mensaje: p.nota || '', notas: '', citaId: cita.id });
        this.save(db); return { ok: true, resumen: { servicio: s.nombre, fecha: p.fecha, hora: p.hora } };
      }
      case 'consulta': {
        db.sol.unshift({ id: 'S' + Date.now(), creada: this.stamp(), tipo: 'Consulta', origen: p.origen || 'Soy nuevo', estado: 'Nueva', nombre: p.nombre, ci: String(p.ci || '').replace(/\D/g, ''), tel: p.tel, email: p.email || '', servicio: sv(p.servicio).nombre || '', fecha: '', hora: '', prof: '', mensaje: p.mensaje, notas: '', citaId: '' });
        this.save(db); return { ok: true };
      }
      case 'login': return { ok: true };
      case 'accesoPedir': {
        if (String(p.ci) !== '1234567') return { ok: false, noExiste: true, error: 'No encontramos esa cédula entre nuestros pacientes. (Demo: usá 1234567)' };
        db.sol.unshift({ id: 'S' + Date.now(), creada: this.stamp(), tipo: 'Acceso', origen: 'Ya soy paciente', estado: 'Nueva', nombre: 'Paciente de prueba', ci: '1234567', tel: '0981000000', email: '', servicio: '', fecha: '', hora: '', prof: '', mensaje: 'Código: 123456  (vence en 24 hs)', notas: '', citaId: '' });
        this.save(db); return { ok: true, tel: '•••• 000', demoCodigo: '123456' };
      }
      case 'accesoValidar': return String(p.ci) === '1234567' && String(p.codigo) === '123456' ? { ok: true, token: 'demo-token-0000000000000000', nombre: 'Paciente de prueba' } : { ok: false, error: 'Código incorrecto o vencido.' };
      case 'portalSalir': return { ok: true };
      case 'portal': {
        const hoy = ymd(new Date());
        const citas = db.citas.filter(c => c.ci === '1234567' && c.fecha >= hoy && c.estado !== 'Cancelado').map(c => ({ id: c.id, fecha: c.fecha, hora: c.hora, prof: pn(c.profId), estado: c.estado, estadoId: c.estado, motivo: c.servicio }));
        return { ok: true, nombre: 'Paciente de prueba', citas, errores: [], estConfirmada: 'Confirmado',
          tratamientos: [{ id: 't1', nombre: 'Ortodoncia', fecha: '2026-08-10', total: 4500000, abonado: 3000000, deuda: 1500000, finalizado: false, prof: 'Profesional 2' }, { id: 't2', nombre: 'Limpieza y profilaxis', fecha: '2026-06-02', total: 350000, abonado: 350000, deuda: 0, finalizado: true, prof: 'Profesional 1' }],
          pagos: [{ fecha: '2026-10-05', monto: 500000, medio: 'Transferencia' }, { fecha: '2026-09-05', monto: 500000, medio: 'Tarjeta de crédito' }],
          pagosEnRevision: db.sol.filter(x => x.tipo === 'Pago' && x.estado === 'Nueva').map(x => ({ fecha: x.creada.slice(0, 10), monto: x.monto })),
          deudaTotal: 1500000, pago: { banco: 'Banco (ejemplo)', titular: 'Clínica SOE Health Care', cuenta: '000000000', ruc: '80000000-0', alias: '', nota: 'Cuando la clínica verifique tu transferencia, el pago se va a ver reflejado en tu estado de cuenta.' } };
      }
      case 'portalServicios': return { ok: true, servicios: DEF.servicios.map(s => ({ ...s, profs: DEF.profesionales.filter(x => x.esp.split(',').includes(s.esp)).map(x => ({ id: x.id, nombre: x.nombre, dias: x.dias.split(',').map(Number) })) })).filter(s => s.profs.length) };
      case 'portalCita': {
        const c = db.citas.find(x => x.id === p.id); if (!c) return { ok: false, error: 'Cita no encontrada' };
        if (p.accion === 'confirmar') c.estado = 'Confirmado';
        if (p.accion === 'cancelar') c.estado = 'Cancelado';
        if (p.accion !== 'confirmar') db.sol.unshift({ id: 'S' + Date.now(), creada: this.stamp(), tipo: p.accion === 'cancelar' ? 'Cancelación' : 'Cambio', origen: 'Ya soy paciente', estado: 'Nueva', nombre: 'Paciente de prueba', ci: '1234567', tel: '0981000000', email: '', servicio: c.servicio, fecha: c.fecha, hora: c.hora, prof: '', mensaje: p.accion === 'cancelar' ? 'El paciente canceló su turno desde la app.' + (p.motivo ? '\nMotivo: ' + p.motivo : '') : 'Pide cambiar este turno.\n' + (p.motivo || ''), notas: '', citaId: c.id });
        this.save(db); return { ok: true };
      }
      case 'portalPago': {
        db.sol.unshift({ id: 'S' + Date.now(), creada: this.stamp(), tipo: 'Pago', origen: 'Ya soy paciente', estado: 'Nueva', nombre: 'Paciente de prueba', ci: '1234567', tel: '0981000000', email: '', servicio: p.detalle, fecha: '', hora: '', prof: '', mensaje: 'Pago por transferencia · Gs. ' + dots(p.monto) + (p.nota ? '\n' + p.nota : '') + '\nRegistrar en Dentalink al verificar.', notas: '', citaId: '', monto: p.monto, adjunto: '' });
        this.save(db); return { ok: true };
      }
      case 'admin': return { ok: true, sol: db.sol, profs: DEF.profesionales, servicios: DEF.servicios, plantillas: DEF.plantillas, clinica: DEF.clinica, equipo: DEF.equipo, promos: DEF.promos };
      case 'agenda': return { ok: true, estados: ['No confirmado', 'Confirmado', 'Atendido', 'Cancelado'].map(n => ({ id: n, nombre: n })), citas: db.citas.filter(c => c.fecha === p.fecha).sort((x, y) => x.hora.localeCompare(y.hora)).map(c => ({ ...c, estadoId: c.estado, anulada: c.estado === 'Cancelado', profNombre: pn(c.profId) })) };
      case 'slotsAdmin': return { ok: true, slots: calcSlots(DEF.clinica, DEF.profesionales, DEF.servicios, db.citas, p.fecha, p.servicio, this.now()).map(x => ({ hora: x.hora, prof: x.prof, profNombre: pn(x.prof) })) };
      case 'updSol': {
        const s = db.sol.find(x => x.id === p.id); if (!s) return { ok: false, error: 'No encontrada' };
        Object.assign(s, p.patch);
        const c = s.citaId && db.citas.find(x => x.id === s.citaId);
        if (c && p.patch.estado) { const m = { Confirmada: 'Confirmado', Atendida: 'Atendido', Descartada: 'Cancelado' }; if (m[p.patch.estado]) c.estado = m[p.patch.estado]; }
        this.save(db); return { ok: true };
      }
      case 'agendar': {
        const s = db.sol.find(x => x.id === p.id); const se = sv(p.servicio);
        const ok = calcSlots(DEF.clinica, DEF.profesionales, DEF.servicios, db.citas, p.fecha, p.servicio, this.now()).some(x => x.hora === p.hora);
        if (!ok) return { ok: false, error: 'Ese horario ya no está libre' };
        const cita = { id: 'C' + Date.now(), fecha: p.fecha, hora: p.hora, dur: se.dur, servId: se.id, servicio: se.nombre, profId: p.prof, paciente: s.nombre, ci: s.ci, tel: s.tel, estado: 'No confirmado' };
        db.citas.push(cita);
        Object.assign(s, { estado: 'Agendada', servicio: se.nombre, fecha: p.fecha, hora: p.hora, prof: p.prof, citaId: cita.id });
        this.save(db); return { ok: true };
      }
      case 'cancelarCita': { const c = db.citas.find(x => x.id === p.id); if (c) c.estado = 'Cancelado'; const s = db.sol.find(x => x.citaId === p.id); if (s) s.estado = 'Descartada'; this.save(db); return { ok: true }; }
      case 'telCita': { const c = db.citas.find(x => x.id === p.id); return { ok: true, tel: c ? c.tel : '' }; }
      case 'estadoCita': { const c = db.citas.find(x => x.id === p.id); if (c) c.estado = p.estado; const m = { Confirmado: 'Confirmada', Atendido: 'Atendida', Cancelado: 'Descartada' }; const s = c && db.sol.find(x => x.citaId === c.id); if (s && m[p.estado]) s.estado = m[p.estado]; this.save(db); return { ok: true }; }
    }
    return { ok: false, error: 'Acción desconocida' };
  }
};

/* ---- Pedir turno ---- */
let T = {};
function pTurno(servId) {
  T = { paso: servId ? 2 : 1, servicio: servId || '', fecha: '', hora: '', slots: null };
  drawTurno();
}
function diasDisponibles() {
  const out = []; const d = new Date();
  for (let i = 0; i <= CFG.clinica.diasMax && out.length < 21; i++) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
    if (CFG.dias.includes(x.getDay())) out.push(ymd(x));
  }
  return out;
}
function drawTurno() {
  const s = CFG.servicios.find(x => x.id === T.servicio);
  const steps = `<div class="steps">${[1, 2, 3].map(n => `<i class="${T.paso >= n ? 'on' : ''}"></i>`).join('')}</div>`;
  let body = '';
  if (T.paso === 1) {
    body = `<h3 style="margin-bottom:10px">¿Qué necesitás?</h3>` + CFG.servicios.map(x => `<button class="opt${x.id === T.servicio ? ' sel' : ''}" data-s="${x.id}"><small>${x.dur} min</small><b>${esc(x.nombre)}</b><span>${esc(x.desc)}</span></button>`).join('');
  } else if (T.paso === 2) {
    const dias = diasDisponibles();
    body = `<div class="sum"><b>${esc(s.nombre)}</b> · ${s.dur} min <a href="javascript:void(0)" onclick="T.paso=1;drawTurno()" class="small" style="float:right">Cambiar</a></div>
      <h3 style="margin:16px 0 8px">Elegí el día</h3>
      <div class="days">${dias.map(f => { const d = parseYmd(f); return `<button class="day${f === T.fecha ? ' sel' : ''}" data-f="${f}"><small>${DIAS[d.getDay()]}</small><b>${d.getDate()}</b><small>${pad(d.getMonth() + 1)}</small></button>`; }).join('')}</div>
      <div id="slots">${T.fecha ? '' : '<p class="muted small">Tocá un día para ver los horarios libres.</p>'}</div>`;
  } else if (T.paso === 3) {
    body = `<div class="sum"><b>${esc(s.nombre)}</b><br>📅 ${fCorta(T.fecha)} · 🕐 ${T.hora} hs <a href="javascript:void(0)" onclick="T.paso=2;drawTurno()" class="small" style="float:right">Cambiar</a></div>
      <h3 style="margin:16px 0 0">Tus datos</h3>
      <label class="f">Nombre y apellido<input class="inp" id="tNom" autocomplete="name"></label>
      <label class="f">Cédula de identidad<input class="inp" id="tCi" inputmode="numeric" placeholder="Sin puntos"></label>
      <div id="ciNote"></div>
      <label class="f">WhatsApp<input class="inp" id="tTel" inputmode="tel" placeholder="0981 123 456" autocomplete="tel"></label>
      <label class="f">Email (opcional)<input class="inp" id="tMail" type="email" autocomplete="email"></label>
      <label class="f">¿Algo que debamos saber? (opcional)<textarea class="inp" id="tNota" placeholder="Ej: tengo dolor en una muela"></textarea></label>
      <label class="chk"><input type="checkbox" id="tOk"> Acepto que la clínica me contacte por WhatsApp para confirmar mi turno.</label>
      <div class="err" id="tErr"></div>
      <button class="btn pri block" id="tSend" style="margin-top:8px">Confirmar turno</button>`;
  }
  view(`<div class="wrap">${topbar('Pedir turno', '#/nuevo')}${steps}${body}${footer()}</div>`);
  if (T.paso === 1) $$('[data-s]').forEach(b => b.onclick = () => { T.servicio = b.dataset.s; T.paso = 2; T.fecha = ''; T.hora = ''; drawTurno(); });
  if (T.paso === 2) { $$('[data-f]').forEach(b => b.onclick = () => pickDay(b.dataset.f)); if (T.fecha) pickDay(T.fecha); }
  if (T.paso === 3) bindDatos();
}
async function pickDay(f) {
  T.fecha = f; $$('[data-f]').forEach(b => b.classList.toggle('sel', b.dataset.f === f));
  const box = $('#slots'); box.innerHTML = '<div class="loading">Buscando horarios…</div>';
  const r = await api('slots', { fecha: f, servicio: T.servicio }).catch(() => ({ ok: false }));
  if (T.fecha !== f) return;
  if (!r.ok) { box.innerHTML = '<p class="err">No pudimos cargar los horarios. Probá de nuevo.</p>'; return; }
  box.innerHTML = r.slots.length ? `<h3 style="margin:6px 0 4px;font-size:16px">Horarios libres · ${fCorta(f)}</h3><div class="slots">${r.slots.map(x => `<button class="slot" data-h="${x.hora}">${x.hora}</button>`).join('')}</div>`
    : `<div class="note warn">No quedan horarios libres para ese día. Probá con otro día o <a href="${waClinica(`Hola! Busco turno para ${CFG.servicios.find(x => x.id === T.servicio).nombre} el ${fCorta(f)}.`)}" target="_blank">escribinos por WhatsApp</a>.</div>`;
  $$('[data-h]', box).forEach(b => b.onclick = () => { T.hora = b.dataset.h; T.paso = 3; drawTurno(); });
}
function bindDatos() {
  const ci = $('#tCi');
  ci.addEventListener('blur', async () => {
    const v = ci.value.replace(/\D/g, ''); if (v.length < 5) { $('#ciNote').innerHTML = ''; return; }
    const r = await api('checkCi', { ci: v }).catch(() => ({}));
    $('#ciNote').innerHTML = r.existe ? `<div class="note">👋 ¡Ya sos paciente de la clínica! Podés seguir acá, o <a href="#/paciente">ingresar como paciente</a> para ver tus citas y tu estado de cuenta.</div>` : '';
  });
  $('#tSend').onclick = async () => {
    const d = { nombre: $('#tNom').value.trim(), ci: $('#tCi').value.replace(/\D/g, ''), tel: $('#tTel').value.trim(), email: $('#tMail').value.trim(), nota: $('#tNota').value.trim() };
    const e = !d.nombre ? 'Escribí tu nombre y apellido' : d.ci.length < 5 ? 'Revisá tu número de cédula' : waNum(d.tel).length < 11 ? 'Revisá tu número de WhatsApp' : !$('#tOk').checked ? 'Marcá la casilla para que te podamos contactar' : '';
    if (e) { $('#tErr').textContent = e; return; }
    const b = $('#tSend'); b.disabled = true; b.textContent = 'Reservando…';
    const r = await api('turno', { ...d, servicio: T.servicio, fecha: T.fecha, hora: T.hora, origen: 'Soy nuevo' }).catch(() => ({ ok: false, error: 'Sin conexión. Probá de nuevo.' }));
    if (!r.ok) { $('#tErr').textContent = r.error || 'No se pudo reservar'; b.disabled = false; b.textContent = 'Confirmar turno'; if (/ocup/.test(r.error || '')) { T.paso = 2; T.hora = ''; setTimeout(drawTurno, 1500); } return; }
    const rs = r.resumen;
    view(`<div class="wrap"><div class="card okbig" style="margin-top:20px"><div class="c">✓</div><h2>${r.pendiente ? '¡Recibimos tu pedido!' : '¡Turno reservado!'}</h2>
      <div class="sum" style="margin:14px 0;text-align:left"><b>${esc(rs.servicio)}</b><br>📅 ${fCorta(rs.fecha)}<br>🕐 ${rs.hora} hs<br>📍 ${esc(CFG.clinica.direccion)}</div>
      <p class="small muted">Te vamos a escribir por WhatsApp para confirmar tu asistencia. Si necesitás cambiarlo, avisanos con anticipación.</p>
      <a class="btn wa block" href="${waClinica(`Hola! Soy ${d.nombre}, reservé un turno para ${rs.servicio} el ${fCorta(rs.fecha)} a las ${rs.hora}.`)}" target="_blank" rel="noopener">${IC.wa} Escribir a la clínica</a>
      <button class="btn block" style="margin-top:8px" onclick="go('#/')">Volver al inicio</button></div></div>`);
  };
}

function ask(titulo, texto, ph, obligatorio) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="m-box"><div class="m-head"><h3>${esc(titulo)}</h3><button data-x>✕</button></div>${texto ? `<p class="small muted" style="margin:0 0 8px">${esc(texto)}</p>` : ''}<textarea class="inp" id="askT" placeholder="${esc(ph || '')}"></textarea><div class="err" id="askE"></div><div class="row" style="margin-top:10px"><button class="btn" data-x>Volver</button><button class="btn pri" id="askOk">Confirmar</button></div></div>`;
    document.body.appendChild(m);
    m.onclick = e => { if (e.target === m || e.target.closest('[data-x]')) { m.remove(); res(null); } };
    $('#askOk', m).onclick = () => { const v = $('#askT', m).value.trim(); if (obligatorio && !v) { $('#askE', m).textContent = 'Contanos un poco más'; return; } m.remove(); res(v); };
  });
}
function fileToB64(file) {
  return new Promise((res, rej) => {
    if (/^image\//.test(file.type)) {
      const img = new Image();
      img.onload = () => { let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, 1600 / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k); const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(img.src); res({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', .82).split(',')[1] }); };
      img.onerror = () => rej(new Error('No pudimos leer la imagen'));
      img.src = URL.createObjectURL(file);
    } else if (file.type === 'application/pdf') {
      if (file.size > 8e6) return rej(new Error('El PDF es muy pesado (máx. 8 MB)'));
      const r = new FileReader(); r.onload = () => res({ mime: 'application/pdf', data: String(r.result).split(',')[1] }); r.onerror = () => rej(new Error('No pudimos leer el archivo')); r.readAsDataURL(file);
    } else rej(new Error('Subí una foto o un PDF'));
  });
}

/* ---- Turno para pacientes (eligen profesional) ---- */
let PU = {};
async function pPTurno() {
  const ses = PT.get(); if (!ses) return pAcceso();
  PU = { paso: 1, s: null, prof: '', fecha: '', hora: '', lista: [] };
  view(`<div class="wrap">${topbar('Pedir turno', '#/paciente')}<div class="loading">Cargando…</div></div>`);
  const r = await api('portalServicios', { token: ses.token }).catch(() => ({ ok: false, error: 'Sin conexión' }));
  if (!r.ok) { if (r.auth) return sesionVencida(); view(`<div class="wrap">${topbar('Pedir turno', '#/paciente')}<div class="note warn">${esc(r.error)}</div></div>`); return; }
  PU.lista = r.servicios; drawPU();
}
function drawPU() {
  const ses = PT.get();
  const steps = `<div class="steps">${[1, 2, 3, 4].map(n => `<i class="${PU.paso >= n ? 'on' : ''}"></i>`).join('')}</div>`;
  const pr = PU.s && PU.s.profs.find(x => x.id === PU.prof);
  const resumen = () => `<div class="sum"><b>${esc(PU.s.nombre)}</b><br>👩‍⚕️ ${pr ? esc(pr.nombre) : 'Cualquier profesional disponible'}${PU.fecha ? `<br>📅 ${fCorta(PU.fecha)}${PU.hora ? ' · 🕐 ' + PU.hora + ' hs' : ''}` : ''}</div>`;
  let body = '';
  if (PU.paso === 1) body = `<h3 style="margin-bottom:10px">¿Qué necesitás?</h3>` + (PU.lista.length ? PU.lista.map(x => `<button class="opt" data-sv="${x.id}"><small>${x.dur} min</small><b>${esc(x.nombre)}</b><span>${esc(x.desc)}</span></button>`).join('') : '<div class="note warn">No hay servicios disponibles para reservar online. Escribinos por WhatsApp.</div>');
  else if (PU.paso === 2) body = resumen() + `<h3 style="margin:16px 0 10px">¿Con quién?</h3><button class="opt" data-pf=""><b>Cualquier profesional disponible</b><span>Te mostramos todos los horarios libres</span></button>` + PU.s.profs.map(x => `<button class="opt" data-pf="${x.id}"><b>${esc(x.nombre)}</b><span>${x.dias.map(d => DIAS[d]).join(', ')}</span></button>`).join('');
  else if (PU.paso === 3) {
    const dset = new Set((pr ? [pr] : PU.s.profs).flatMap(x => x.dias));
    const dias = []; const d = new Date();
    for (let i = 0; i <= (CFG.clinica.diasMax || 30) && dias.length < 21; i++) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i); if (dset.has(x.getDay())) dias.push(ymd(x)); }
    body = resumen() + `<h3 style="margin:16px 0 8px">Elegí el día</h3><div class="days">${dias.map(f => { const x = parseYmd(f); return `<button class="day${f === PU.fecha ? ' sel' : ''}" data-f="${f}"><small>${DIAS[x.getDay()]}</small><b>${x.getDate()}</b><small>${pad(x.getMonth() + 1)}</small></button>`; }).join('')}</div><div id="slots"><p class="muted small">Tocá un día para ver los horarios libres.</p></div>`;
  } else body = resumen() + `<label class="f">¿Algo que debamos saber? (opcional)<textarea class="inp" id="puN"></textarea></label><div class="err" id="puE"></div><button class="btn pri block" id="puOk" style="margin-top:10px">Confirmar turno</button>`;
  view(`<div class="wrap">${topbar('Pedir turno', '#/paciente')}${steps}${PU.paso > 1 ? `<a href="javascript:void(0)" class="small" id="puBack">← Volver un paso</a>` : ''}<div style="margin-top:8px">${body}</div>${footer()}</div>`);
  if ($('#puBack')) $('#puBack').onclick = () => { PU.paso--; if (PU.paso < 4) PU.hora = ''; if (PU.paso < 3) PU.fecha = ''; drawPU(); };
  $$('[data-sv]').forEach(b => b.onclick = () => { PU.s = PU.lista.find(x => x.id === b.dataset.sv); PU.paso = 2; drawPU(); });
  $$('[data-pf]').forEach(b => b.onclick = () => { PU.prof = b.dataset.pf; PU.paso = 3; drawPU(); });
  $$('[data-f]').forEach(b => b.onclick = async () => {
    PU.fecha = b.dataset.f; $$('[data-f]').forEach(x => x.classList.toggle('sel', x === b));
    const box = $('#slots'); box.innerHTML = '<div class="loading">Buscando horarios…</div>';
    const r = await api('slots', { fecha: PU.fecha, servicio: PU.s.id, prof: PU.prof, origen: 'Paciente', token: ses.token }).catch(() => ({ ok: false }));
    if (r.auth) return sesionVencida();
    if (!r.ok) { box.innerHTML = '<p class="err">No pudimos cargar los horarios.</p>'; return; }
    box.innerHTML = r.slots.length ? `<div class="slots">${r.slots.map(x => `<button class="slot" data-h="${x.hora}">${x.hora}</button>`).join('')}</div>` : '<div class="note warn">No quedan horarios libres ese día. Probá con otro.</div>';
    $$('[data-h]', box).forEach(h => h.onclick = () => { PU.hora = h.dataset.h; PU.paso = 4; drawPU(); });
  });
  if (PU.paso === 4) $('#puOk').onclick = async () => {
    const b = $('#puOk'); b.disabled = true; b.textContent = 'Reservando…';
    const r = await api('turno', { token: ses.token, origen: 'Paciente', servicio: PU.s.id, prof: PU.prof, fecha: PU.fecha, hora: PU.hora, nota: $('#puN').value.trim() }).catch(() => ({ ok: false, error: 'Sin conexión' }));
    if (!r.ok) { if (r.auth) return sesionVencida(); $('#puE').textContent = r.error; b.disabled = false; b.textContent = 'Confirmar turno'; if (/ocup/.test(r.error || '')) { PU.paso = 3; PU.hora = ''; setTimeout(drawPU, 1500); } return; }
    P = null;
    view(`<div class="wrap"><div class="card okbig" style="margin-top:20px"><div class="c">✓</div><h2>${r.pendiente ? '¡Recibimos tu pedido!' : '¡Turno reservado!'}</h2>${resumen()}<p class="small muted">${r.pendiente ? 'La clínica te va a confirmar el horario por WhatsApp.' : 'Te esperamos. Podés confirmarlo o cambiarlo desde "Mis turnos".'}</p><button class="btn pri block" onclick="go('#/paciente')">Ir a mis turnos</button></div></div>`);
  };
}

/* =================== RECEPCIÓN =================== */
let A = { tab: 'bandeja', filtro: 'activas', tipo: '', q: '', fecha: ymd(new Date()) };
function pLogin(msg = '') {
  view(`<div class="wrap"><div class="card" style="margin-top:10vh;text-align:center"><img src="${LOGO}" style="width:130px"><h2 style="margin:10px 0">Recepción</h2>
    <input class="inp" id="lk" type="password" placeholder="Clave de acceso"><button class="btn pri block" id="lb" style="margin-top:10px">Ingresar</button><div class="err">${esc(msg)}</div>
    <a href="#/" class="small muted">← Volver</a></div></div>`);
  const goIn = async () => { KEY = $('#lk').value.trim(); $('#lb').textContent = 'Verificando…'; const r = await api('login').catch(() => ({ ok: false, error: 'Sin conexión' })); if (r.ok) { store.set('soeat_key', KEY); pAdmin(); } else pLogin(r.error || 'Clave incorrecta'); };
  $('#lb').onclick = goIn; $('#lk').onkeydown = e => { if (e.key === 'Enter') goIn(); }; $('#lk').focus();
}
async function pAdmin() {
  if (!DEMO && !KEY) return pLogin();
  if (!$('#adm')) {
    $('#app').innerHTML = `<div id="adm"><div class="abar"><div class="in"><img src="${LOGO}"><h3>Recepción ${DEMO ? '<span class="demo">Modo demo</span>' : ''}</h3><button class="btn sm" onclick="reloadAdmin()">↻ Actualizar</button>${DEMO ? '' : '<button class="btn sm" onclick="store.del(\'soeat_key\');KEY=\'\';pLogin()">Salir</button>'}</div><div class="tabs" id="tabs"></div></div><div class="wrap wide" id="abody"><div class="loading">Cargando…</div></div></div>`;
  }
  await reloadAdmin();
}
async function reloadAdmin() {
  const r = await api('admin').catch(() => ({ ok: false, error: 'Sin conexión' }));
  if (!r.ok) { if (r.auth === false) return pLogin('Ingresá la clave'); $('#abody').innerHTML = `<div class="note warn">${esc(r.error)}</div>`; return; }
  ADM = r; drawAdmin();
}
const profName = id => ((ADM.profs || []).find(p => p.id === id) || {}).nombre || '';
function drawAdmin() {
  const nuevas = ADM.sol.filter(s => s.estado === 'Nueva').length;
  $('#tabs').innerHTML = [['bandeja', `Bandeja${nuevas ? `<span class="n">${nuevas}</span>` : ''}`], ['agenda', 'Agenda'], ['config', 'Contenido y configuración']].map(([k, t]) => `<button class="tab${A.tab === k ? ' on' : ''}" data-t="${k}">${t}</button>`).join('');
  $$('#tabs [data-t]').forEach(b => b.onclick = () => { A.tab = b.dataset.t; drawAdmin(); });
  if (A.tab === 'bandeja') drawBandeja(); else if (A.tab === 'agenda') drawAgenda(); else drawConfig();
}
function drawBandeja() {
  const F = { activas: s => !['Atendida', 'Descartada'].includes(s.estado), todas: () => true };
  ESTADOS.forEach(e => F[e] = s => s.estado === e);
  $('#abody').innerHTML = `<div class="filters"><input class="inp" id="aq" placeholder="Buscar nombre, cédula o teléfono…" value="${esc(A.q)}">
    <select class="inp" id="atp" style="flex:0 0 auto"><option value="">Todo</option><option value="Turno"${A.tipo === 'Turno' ? ' selected' : ''}>Solo turnos</option><option value="Consulta"${A.tipo === 'Consulta' ? ' selected' : ''}>Solo consultas</option>${['Acceso', 'Pago', 'Cancelación', 'Cambio'].map(t => `<option value="${t}"${A.tipo === t ? ' selected' : ''}>${t === 'Acceso' ? 'Pedidos de acceso' : t === 'Pago' ? 'Pagos' : t === 'Cambio' ? 'Pedidos de cambio' : 'Cancelaciones'}</option>`).join('')}</select></div>
    <div class="chips" style="margin-bottom:14px">${['activas', ...ESTADOS, 'todas'].map(k => `<button class="chip${A.filtro === k ? ' on' : ''}" data-fl="${k}">${k === 'activas' ? 'Pendientes' : k === 'todas' ? 'Todas' : k} (${ADM.sol.filter(F[k]).length})</button>`).join('')}</div><div id="alist"></div>`;
  const draw = () => {
    const q = A.q.toLowerCase();
    const list = ADM.sol.filter(F[A.filtro]).filter(s => !A.tipo || s.tipo === A.tipo).filter(s => !q || `${s.nombre} ${s.ci} ${s.tel}`.toLowerCase().includes(q));
    $('#alist').innerHTML = list.length ? list.map(solCard).join('') : '<div class="card muted" style="text-align:center">No hay nada por acá 🎉</div>';
  };
  draw();
  $('#aq').oninput = e => { A.q = e.target.value; draw(); };
  $('#atp').onchange = e => { A.tipo = e.target.value; draw(); };
  $$('[data-fl]').forEach(b => b.onclick = () => { A.filtro = b.dataset.fl; drawBandeja(); });
  $('#alist').onchange = async e => {
    const sel = e.target.closest('[data-st]'); if (!sel) return;
    await updSol(sel.dataset.st, { estado: sel.value }); toast('Estado: ' + sel.value);
  };
  $('#alist').addEventListener('focusout', async e => {
    const t = e.target.closest('[data-nt]'); if (!t) return;
    const s = ADM.sol.find(x => x.id === t.dataset.nt); if (s && s.notas !== t.value) { await updSol(s.id, { notas: t.value }, true); toast('Nota guardada'); }
  });
  $('#alist').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const s = ADM.sol.find(x => x.id === b.dataset.id);
    if (b.dataset.a === 'wa') {
      if (!String(s.tel).replace(/\D/g, '')) return toast('No tiene celular cargado. Llamalo o pedile el número.', true);
      const cod = (String(s.mensaje).match(/Código: (\d{6})/) || [])[1] || '';
      const tpl = s.tipo === 'Acceso' ? (ADM.plantillas.acceso || ADM.plantillas.general) : s.tipo === 'Turno' ? ADM.plantillas.turno : s.tipo === 'Consulta' ? ADM.plantillas.consulta : ADM.plantillas.general;
      window.open(waLink(s.tel, fill(tpl, { nombre: s.nombre.split(' ')[0], servicio: s.servicio, fecha: s.fecha ? fCorta(s.fecha) : '', hora: s.hora, mensaje: s.mensaje, codigo: cod, link: location.origin + location.pathname + '#/paciente' })), '_blank');
      if (s.estado === 'Nueva') await updSol(s.id, { estado: 'Contactada' });
    } else if (b.dataset.a === 'agendar') agendarModal(s);
  };
}
function solCard(s) {
  return `<div class="sol ${s.estado}"><div class="sol-h"><div><span class="tag ${s.tipo}">${s.tipo}</span> <b>${esc(s.nombre)}</b><div class="small muted">${fDT(s.creada)} · ${esc(s.origen)}</div></div>
    <select class="st" data-st="${s.id}">${ESTADOS.map(e => `<option${e === s.estado ? ' selected' : ''}>${e}</option>`).join('')}</select></div>
    <div class="sol-d">📱 <b>${esc(s.tel)}</b>${s.ci ? ` · CI <b>${esc(s.ci)}</b>` : ''}${s.email ? ` · ${esc(s.email)}` : ''}${s.servicio ? `<br>🦷 <b>${esc(s.servicio)}</b>` : ''}${s.fecha ? `<br>📅 <b>${fCorta(s.fecha)} · ${s.hora} hs</b>${s.prof ? ` · ${esc(profName(s.prof))}` : ''}` : ''}</div>
    ${s.mensaje ? `<div class="sol-m">${esc(s.mensaje)}</div>` : ''}
    ${s.adjunto ? `<a class="btn sm" href="${esc(s.adjunto)}" target="_blank" rel="noopener" style="margin-bottom:8px">📎 Ver comprobante</a>` : ''}
    <textarea data-nt="${s.id}" placeholder="Notas internas…">${esc(s.notas)}</textarea>
    <div class="acts"><button class="btn sm wa" data-a="wa" data-id="${s.id}">${IC.wa} ${s.tipo === 'Acceso' ? 'Enviar código' : 'WhatsApp'}</button>${!s.citaId && (s.tipo === 'Consulta' || s.tipo === 'Turno') ? `<button class="btn sm" data-a="agendar" data-id="${s.id}">📅 Agendar</button>` : ''}</div></div>`;
}
async function updSol(id, patch, quiet) {
  const r = await api('updSol', { id, patch }).catch(() => ({ ok: false, error: 'Sin conexión' }));
  if (!r.ok) return toast(r.error || 'No se pudo guardar', true);
  if (r.aviso) toast(r.aviso, true);
  Object.assign(ADM.sol.find(x => x.id === id), patch);
  if (!quiet) drawAdmin();
}
function agendarModal(s) {
  const m = document.createElement('div'); m.className = 'modal';
  const dias = []; const d = new Date(); for (let i = 0; i < 30; i++) dias.push(ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() + i)));
  const servDef = (ADM.servicios.find(x => x.nombre === s.servicio) || ADM.servicios[0]).id;
  m.innerHTML = `<div class="m-box"><div class="m-head"><h3>Agendar a ${esc(s.nombre)}</h3><button data-x>✕</button></div>
    ${s.ci ? '' : `<label class="f">Cédula del paciente (necesaria para Dentalink)<input class="inp" id="mCi" inputmode="numeric" placeholder="Sin puntos"></label>`}
    <label class="f">Servicio<select class="inp" id="mS">${ADM.servicios.map(x => `<option value="${x.id}"${x.id === servDef ? ' selected' : ''}>${esc(x.nombre)} (${x.dur} min)</option>`).join('')}</select></label>
    <label class="f">Día<select class="inp" id="mF">${dias.map(f => `<option value="${f}">${fCorta(f)}</option>`).join('')}</select></label>
    <div id="mSl" style="margin-top:12px"></div><div class="err" id="mErr"></div></div>`;
  document.body.appendChild(m);
  const load = async () => {
    $('#mSl', m).innerHTML = '<div class="loading">Buscando…</div>';
    const r = await api('slotsAdmin', { fecha: $('#mF', m).value, servicio: $('#mS', m).value });
    $('#mSl', m).innerHTML = r.ok && r.slots.length ? `<div class="slots">${r.slots.map(x => `<button class="slot" data-h="${x.hora}" data-p="${x.prof}" title="${esc(x.profNombre)}">${x.hora}<br><small style="font-weight:500;font-size:10px">${esc(x.profNombre)}</small></button>`).join('')}</div>` : '<p class="muted small">Sin horarios libres ese día.</p>';
  };
  $('#mS', m).onchange = load; $('#mF', m).onchange = load; load();
  m.onclick = async e => {
    if (e.target === m || e.target.closest('[data-x]')) return m.remove();
    const b = e.target.closest('[data-h]'); if (!b) return;
    const ciIn = $('#mCi', m); if (ciIn && ciIn.value.replace(/\D/g, '').length < 5 && ADM.modo === 'dentalink') { $('#mErr', m).textContent = 'Cargá la cédula del paciente'; return; }
    b.disabled = true;
    const r = await api('agendar', { id: s.id, servicio: $('#mS', m).value, fecha: $('#mF', m).value, hora: b.dataset.h, prof: b.dataset.p, ci: ciIn ? ciIn.value : '' });
    if (!r.ok) { $('#mErr', m).textContent = r.error; load(); return; }
    m.remove(); toast('Turno agendado ✓'); reloadAdmin();
  };
}
async function drawAgenda() {
  $('#abody').innerHTML = `<div class="filters"><input type="date" class="inp" id="agF" value="${A.fecha}" style="flex:0 0 auto"><button class="btn sm" id="agH">Hoy</button><button class="btn sm" id="agM">Mañana</button></div><div id="agL"><div class="loading">Cargando…</div></div>`;
  $('#agF').onchange = e => { A.fecha = e.target.value; drawAgenda(); };
  $('#agH').onclick = () => { A.fecha = ymd(new Date()); drawAgenda(); };
  $('#agM').onclick = () => { const d = new Date(); A.fecha = ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)); drawAgenda(); };
  const r = await api('agenda', { fecha: A.fecha }).catch(() => ({ ok: false }));
  if (!r.ok) { $('#agL').innerHTML = '<div class="note warn">No se pudo cargar la agenda</div>'; return; }
  const ecl = n => /anul|cancel|no asiste|deshab/i.test(n) ? 'c3' : /atendid/i.test(n) ? 'c2' : /no confirm/i.test(n) ? 'c0' : /confirm/i.test(n) ? 'c1' : 'c0';
  const activas = r.citas.filter(c => !c.anulada);
  const est = r.estados || [];
  $('#agL').innerHTML = `<h3 style="margin-bottom:10px">${fCorta(A.fecha)} · ${activas.length} citas</h3>` + (r.citas.length ? `<table class="ag"><thead><tr><th>Hora</th><th>Paciente</th><th class="hide-m">Servicio / motivo</th><th class="hide-m">Profesional</th><th>Estado</th><th></th></tr></thead><tbody>${r.citas.map(c => `<tr${c.anulada ? ' style="opacity:.5"' : ''}><td class="h">${c.hora}</td><td><b>${esc(c.paciente)}</b>${c.tel ? `<div class="small muted">${esc(c.tel)}</div>` : ''}</td><td class="hide-m">${esc(c.servicio)}</td><td class="hide-m">${esc(c.profNombre)}</td><td><span class="est ${ecl(c.estado)}">${esc(c.estado)}</span></td><td style="white-space:nowrap">${!c.anulada ? `<button class="btn sm wa" data-wc="${c.id}">${IC.wa}</button> <select class="st" data-ce="${c.id}" style="margin:0">${(est.some(e => String(e.id) === String(c.estadoId)) ? [] : [{ id: c.estadoId, nombre: c.estado }]).concat(est).map(x => `<option value="${esc(x.id)}"${String(x.id) === String(c.estadoId) ? ' selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select>` : ''}</td></tr>`).join('')}</tbody></table>` : '<div class="card muted" style="text-align:center">No hay citas este día.</div>');
  $$('[data-wc]').forEach(b => b.onclick = async () => {
    const c = r.citas.find(x => String(x.id) === b.dataset.wc);
    const w = window.open('', '_blank');
    let tel = c.tel;
    if (!tel) { const t = await api('telCita', { id: c.id }).catch(() => ({})); tel = t.tel || ''; }
    if (!tel) { if (w) w.close(); return toast('Este paciente no tiene celular cargado en Dentalink', true); }
    const url = waLink(tel, fill(ADM.plantillas.turno, { nombre: String(c.paciente).split(' ')[0], servicio: c.servicio || 'tu consulta', fecha: fCorta(c.fecha), hora: c.hora }));
    if (w) w.location = url; else location.href = url;
  });
  $$('[data-ce]').forEach(s => s.onchange = async () => {
    const nombre = s.options[s.selectedIndex].text;
    const esCancel = DEMO || ADM.modo !== 'dentalink' ? s.value === 'Cancelado' : /cancelado por soe/i.test(nombre);
    const r2 = esCancel ? await api('cancelarCita', { id: s.dataset.ce }) : await api('estadoCita', { id: s.dataset.ce, estado: s.value });
    if (r2.ok) { toast('Cita: ' + nombre); const rr = await api('admin'); if (rr.ok) ADM = rr; drawAgenda(); } else toast(r2.error || 'Error', true);
  });
}
function drawConfig() {
  $('#abody').innerHTML = `<div class="note">${DEMO ? 'En modo demo estos datos son de ejemplo.' : 'Los horarios de atención y quién atiende pacientes nuevos se editan en la pestaña <b>Profesionales</b> del Sheet; las especialidades de cada profesional se toman de Dentalink. Las citas se leen y se crean directo en Dentalink.'}</div>
    <h3 style="margin:16px 0 8px">Servicios</h3><table class="cfgt"><tr><th>Servicio</th><th>Duración</th><th>Especialidad</th></tr>${ADM.servicios.map(s => `<tr><td>${esc(s.nombre)}</td><td>${s.dur} min</td><td>${esc(s.esp)}</td></tr>`).join('')}</table>
    <h3 style="margin:20px 0 8px">Profesionales ${ADM.modo === 'dentalink' ? '<span class="tag Turno">Conectado a Dentalink</span>' : ''}</h3><table class="cfgt"><tr><th>Nombre (interno)</th><th>Especialidades</th><th>Días</th><th>Horario</th><th>Nuevos</th></tr>${ADM.profs.map(p => `<tr><td>${esc(p.nombre)}</td><td>${esc(p.esp)}</td><td>${String(p.dias || '').split(',').filter(x => x !== '').map(n => DIAS[+n]).join(', ')}</td><td>${esc(p.horario)}</td><td>${p.nuevos === true ? '✓' : '—'}</td></tr>`).join('')}</table>
    <p class="small muted">Los nombres de la pestaña Profesionales solo se ven en recepción; lo que ven los pacientes sale de la pestaña Equipo.</p>
    <h3 style="margin:20px 0 8px">Nuestro equipo (público)</h3><table class="cfgt"><tr><th>Nombre</th><th>Cargo / especialidad</th><th>Foto</th></tr>${(ADM.equipo || []).map(m => `<tr><td>${esc(m.nombre)}</td><td>${esc(m.cargo)}</td><td>${m.foto ? '✓' : '—'}</td></tr>`).join('')}</table>
    <h3 style="margin:20px 0 8px">Promociones</h3><table class="cfgt"><tr><th>Promoción</th><th>Etiqueta</th><th>Precio</th><th>Válida hasta</th><th>Estado</th></tr>${(ADM.promos || []).map(x => `<tr><td>${esc(x.titulo)}</td><td>${esc(x.badge)}</td><td>${esc(x.precio)}</td><td>${x.hasta ? fCorta(x.hasta) : 'Sin vencimiento'}</td><td>${x.hasta && x.hasta < ymd(new Date()) ? 'Vencida' : (x.activo === 'NO' ? 'Inactiva' : 'Visible')}</td></tr>`).join('')}</table>
    <p class="small muted">Para cambiar el equipo o las promociones, editá las pestañas <b>Equipo</b> y <b>Promociones</b> del Sheet. Fotos: pegá el enlace de Google Drive (compartido como "Cualquier persona con el enlace").</p>`;
}

/* =================== RUTAS =================== */
async function route() {
  const h = location.hash || '#/';
  const [, r, arg] = h.split('/');
  if (r === 'recepcion') return pAdmin();
  try { await loadCfg(); } catch (e) { view('<div class="wrap"><div class="note warn" style="margin-top:30px">No pudimos cargar la página. Revisá tu conexión y volvé a intentar.</div></div>'); return; }
  ({ '': pHome, nuevo: pNuevo, servicios: pServicios, turno: () => pTurno(arg), consulta: pConsulta, paciente: pPaciente, pturno: pPTurno, equipo: pEquipo, promos: pPromos }[r || ''] || pHome)();
}
window.addEventListener('hashchange', route);
setInterval(() => { if ((location.hash || '').startsWith('#/recepcion') && ADM && A.tab === 'bandeja' && !document.querySelector('.modal') && !document.activeElement.matches('textarea,input')) reloadAdmin(); }, 60000);
route();
</script>
